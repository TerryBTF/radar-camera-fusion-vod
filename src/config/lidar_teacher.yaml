defaults:
  - model: centerpoint
  - _self_

seed: 47020
exp_id: centerpoint_lidar_teacher

data_root: data/view_of_delft
output_dir: outputs/${exp_id}
checkpoint_path: null

class_names: ['Car', 'Pedestrian', 'Cyclist']

batch_size: 2
num_workers: 2
epochs: 12

val_every: 3
save_top_model: 5
log_every: 50

gpus: [0]
sync_bn: true

dataset:
  point_source: lidar
  load_image: false
  transform_radar_to_lidar: false
