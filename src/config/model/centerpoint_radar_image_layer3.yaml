name: centerpoint_radar_image_layer3
exp_id: ${exp_id}

data_root: ${data_root}
class_names: ['Car', 'Pedestrian', 'Cyclist']
point_cloud_range: [0, -25.6, -3, 51.2, 25.6, 2]
voxel_size: [0.32, 0.32, 5]
output_dir: ${output_dir}
fusion_mode: image_sampling_freeze
topk_keep_points: 5
topk_feature_index: 3

image_branch:
  pretrained: true
  feature_layer: layer3
  fusion_hidden_dim: 64
  structured_fusion: false
  use_context_gate: false
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

temporal_encoder:
  enabled: false
  hidden_dim: 32
  feature_indices: [3, 4, 5, 6]
  residual_scale: 1.0

bev_fusion:
  enabled: false
  hidden_channels: 128

geometry_aux:
  enabled: false
  hidden_channels: 128
  loss_weight: 0.2
  occupancy_weight: 1.0
  density_weight: 1.0
  max_density: 16.0
  roi_aware:
    enabled: false
    x_range: null
    y_range: null
    outside_weight: 0.0

camera_prior:
  enabled: false
  hidden_channels: 64
  prior_scale: 0.5
  task_names: null

radar_bev_attention:
  enabled: false
  num_heads: 4
  reduction: 4
  ffn_ratio: 2.0
  dropout: 0.0

object_densifier:
  enabled: false
  hidden_channels: 64
  num_virtual_points: 64
  max_radar_points: 96
  max_lidar_points: 512
  min_radar_points: 1
  min_lidar_points: 8
  normalize_local_xyz: true
  detach_virtual_points: true
  append_virtual_points: true
  append_after_warmup: false
  append_feature_mode: mean
  warmup_epochs: 0
  loss_weight: 0.2

pts_voxel_layer:
  max_num_points: 10
  voxel_size: ${model.voxel_size}
  point_cloud_range: ${model.point_cloud_range}
  max_voxels: [8000, 20000]

voxel_encoder:
  in_channels: 7
  feat_channels: [64, 64]
  pool_mode: 'avg'
  with_distance: TRUE
  voxel_size: ${model.voxel_size}
  point_cloud_range: ${model.point_cloud_range}

middle_encoder:
  in_channels: 64
  output_shape: [160, 160]

backbone:
  in_channels: 64
  layer_nums: [3, 5, 5]
  layer_strides: [2, 2, 2]
  out_channels: [64, 128, 256]

neck:
  in_channels: [64, 128, 256]
  upsample_strides: [1, 2, 4]
  out_channels: [128, 128, 128]

head:
  in_channels: 384
  tasks: [
    {num_class: 1, class_names: ['Car']},
    {num_class: 1, class_names: ['Pedestrian']},
    {num_class: 1, class_names: ['Cyclist']}
    ]
  common_heads:
    reg: [2, 2]
    height: [1, 2]
    dim: [3, 2]
    rot: [2, 2]
    heatmap: ~
  share_conv_channel: 64
  share_conv_num_layers: 2
  bbox_coder:
    pc_range: ${model.point_cloud_range}
    post_center_range: [-5, -30.6, -6, 56.2, 30.6, 5]
    max_num: 350
    score_threshold: 0.1
    out_size_factor: 2
    voxel_size: [0.32, 0.32]
    code_size: 7
  separate_head:
    in_channels: ~
    heads: ~
    init_bias: -2.19
    final_kernel: 3
  loss_cls:
    reduction: 'mean'
    loss_weight: 1.0
  loss_bbox:
    reduction: 'mean'
    loss_weight: 0.25
  norm_bbox: TRUE
  train_cfg:
    grid_size: [160, 160, 1]
    point_cloud_range: ${model.point_cloud_range}
    voxel_size: ${model.voxel_size}
    out_size_factor: 2
    dense_reg: 1
    gaussian_overlap: 0.1
    max_objs: 500
    use_classwise_min_radius: true
    min_radius: [4, 2, 2]
    task_loss_weights: [1.0, 1.0, 1.0]
    roi_aware_training:
      enabled: false
      x_range: null
      y_range: null
      roi_weight: 1.0
      class_weights: {}
      apply_to_heatmap: true
      apply_to_bbox: true
    code_weights: [1.0, 1.0, 0.2, 1.0, 1.0, 0.2, 1.0, 1.0]
  test_cfg:
    post_center_limit_range: [-5, -30.6, -6, 56.2, 30.6, 5]
    max_per_img: 500
    max_pool_nms: False
    min_radius: [4, 0.6, 1.2]
    score_threshold: 0.1
    out_size_factor: 2
    nms_type: 'circle'
    pre_max_size: 1000
    post_max_size: 83
    nms_thr: 0.2

optimizer:
  lr: 0.001
  weight_decay: 0.01
